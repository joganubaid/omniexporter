name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run linter and tests
        run: npm run check

      - name: Package extension bundle
        run: npm run pack

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniexporter-extension
          path: dist/*.zip
          if-no-files-found: error
